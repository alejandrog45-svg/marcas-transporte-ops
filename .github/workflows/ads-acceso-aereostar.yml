name: Comprobar acceso de lectura a Google Ads de Aereostar (manual)
# Solo lectura y sin efectos: no hace commit, no publica y no toca los datos de UberTransfer.
# Descarga a un archivo temporal del runner y muestra únicamente si hubo acceso y cuántas filas llegaron.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceso:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Leer la cuenta de Aereostar (solo lectura)
        env:
          ADS_BRAND: aereostar
          GOOGLE_ADS_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_ADS_OAUTH_CLIENT_ID }}
          GOOGLE_ADS_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_OAUTH_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID_AEREOSTAR: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID_AEREOSTAR || '5485308262' }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
        run: |
          python tools/panel/sync_google_ads.py > /dev/null
          python - <<'PY'
          import json
          d = json.load(open("data/google_ads_aereostar.json", encoding="utf-8"))
          print("ACCESO OK · cuenta", d.get("customerId"), "· campañas", d.get("campaignIds"),
                "· días con datos", len(d.get("history") or []), "· informes", len(d.get("reports") or {}))
          PY
