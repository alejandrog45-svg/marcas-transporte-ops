name: Auditoría técnica semanal
on:
  schedule:
    - cron: "0 12 * * 1"   # lunes 12:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: ops-data
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Auditar sitio
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ubertransfer.cl' }}
        run: PYTHONPATH=src python -m marcas_transporte_ops audit
      - name: Guardar histórico
        run: |
          git config user.name "ops-bot"
          git config user.email "ops-bot@users.noreply.github.com"
          git add data reports/audit_latest.md
          git diff --cached --quiet || git commit -m "data: auditoría semanal"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
      - name: Abrir Issue si hay alertas
        if: hashFiles('reports/alerts.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Alertas de auditoría $(date +%F)" --body-file reports/alerts.md
