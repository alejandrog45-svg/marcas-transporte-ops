name: Auditoría de aereostar.cl (manual)
# Solo lectura y gentil: 3 s entre páginas y máximo 25 páginas. No toca los datos de UberTransfer.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ops-data
  cancel-in-progress: false
jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Auditar aereostar.cl
        env:
          SITE_URL: https://aereostar.cl
          AUDIT_TAG: aereostar
          AUDIT_DELAY: "3"
          AUDIT_MAX_URLS: "25"
        run: PYTHONPATH=src python -m marcas_transporte_ops audit
      - name: Guardar resultado
        if: always()
        run: |
          git config user.name "ops-bot"
          git config user.email "ops-bot@users.noreply.github.com"
          for f in data/audit_aereostar_latest.json reports/audit_aereostar_latest.md; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "data: auditoría de aereostar.cl"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
