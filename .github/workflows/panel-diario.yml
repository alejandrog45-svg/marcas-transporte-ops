name: Panel diario (auditoría + publicación)
on:
  schedule:
    - cron: "45 11 * * *"   # todos los días 11:45 UTC (07:45–08:45 hora de Chile)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ops-data
  cancel-in-progress: false
jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - run: pip install -r requirements.txt

      - name: Auditar sitio (datos reales de hoy)
        id: audit
        continue-on-error: true   # si falla, el panel se publica igual con la última auditoría buena y el job termina en rojo al final
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ubertransfer.cl' }}
        run: PYTHONPATH=src python -m marcas_transporte_ops audit

      - name: Sincronizar Google Ads UberTransfer (solo lectura)
        env:
          GOOGLE_ADS_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_ADS_OAUTH_CLIENT_ID }}
          GOOGLE_ADS_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_OAUTH_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID || '2035504421' }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
        run: python tools/panel/sync_google_ads.py

      - name: Sincronizar Google Ads Aereostar (solo lectura)
        continue-on-error: true   # si falla, UberTransfer y el resto del flujo siguen igual
        env:
          GOOGLE_ADS_BRAND: Aereostar
          GOOGLE_ADS_CUSTOMER_ID: "5485308262"
          GOOGLE_ADS_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_ADS_OAUTH_CLIENT_ID }}
          GOOGLE_ADS_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_OAUTH_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
        run: python tools/panel/sync_google_ads.py

      - name: Actualizar sugerencias de campaña (solo lectura)
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::Falta FIREBASE_SERVICE_ACCOUNT: el panel se publicará sin actualizar sugerencias en Firestore."
          else
            python tools/panel/sync_suggestions_firestore.py
          fi

      - name: Sugerencias con IA (Gemini, solo lectura)
        continue-on-error: true   # la IA es un extra: si falla, el panel se arma igual con las sugerencias de reglas
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tools/panel/ai_enrich_suggestions.py

      - name: Armar panel
        env:
          PANEL_DATA_KEY: ${{ secrets.PANEL_DATA_KEY }}
        run: python tools/panel/build.py

      - name: Guardar histórico de la auditoría
        run: |
          git config user.name "ops-bot"
          git config user.email "ops-bot@users.noreply.github.com"
          git add data reports/audit_latest.md
          git diff --cached --quiet || git commit -m "data: auditoría diaria"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push

      - name: Publicar en Firebase Hosting
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::warning::Falta el secreto FIREBASE_SERVICE_ACCOUNT: el panel se armó pero NO se publicó."
            exit 0
          fi
          umask 077
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@15.19.0 deploy --only hosting --project ubertransfer-ops --non-interactive
          rm -f "$RUNNER_TEMP/firebase-sa.json"

      - name: Fallar si la auditoría no se ejecutó
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error title=Auditoría no ejecutada::el panel se publicó con la última auditoría buena; revisar robots.txt/sitemap del sitio"
          exit 1
